services:
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  eureka-server:
    image: eureka-server
    build:
      context: ../eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"

  gateway:
    image: gateway
    build:
      context: ../gateway
    container_name: gateway
    ports:
      - "8081:8080"
    environment:
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server

  server:
    image: spring-boot-websocket-app
    build:
          context: ./
    deploy:
      replicas: 3
    environment:
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      - redis
      - eureka-server

networks:
  default:
    name: eureka-network
    driver: bridge
